# gp-relay — GlobalProtect VPN в контейнере.
# SOCKS5 на :1080 (перепривязывается к туннелю автоматически).
# Подключение к VPN запускает GUI (docker exec + socat + openconnect).
services:
  gp-relay:
    build: ./docker
    image: gp-relay:latest
    container_name: gp-relay
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "1080:1080"   # SOCKS5 (хост -> dante в контейнере)
    restart: unless-stopped
    # ручное подключение VPN (интерактивно, OTP в терминале):
    #   docker exec -i gp-relay socat - 'EXEC:"openconnect --protocol=gp gp.domru.ru",pty,stderr,sane'
    # проверка туннеля:
    #   curl -x socks5h://localhost:1080 -o /dev/null -w '%{http_code}\n' https://ticket.ertelecom.ru
