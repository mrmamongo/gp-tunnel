# Dante SOCKS5: слушаем 1080. external — eth0 до туннеля; entry-надзиратель
# при появлении tun0 перепишет на IP туннеля и рестартнет dante (runtime-конфиг).
logoutput: stderr

internal: 0.0.0.0 port = 1080
external: eth0

socksmethod: none

client pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  log: error
}

socks pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  log: error
}
