name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (NSIS installer)
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Build portable kit (single exe + README + checksums)
        shell: pwsh
        run: ./tools/build-portable-docker.ps1 -Zip

      - name: Upload installer + portable kit
        uses: actions/upload-artifact@v4
        with:
          name: gp-relay-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            packages/*.zip
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gp-relay-windows-x64-${{ github.sha }}
          path: dist

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          version="${GITHUB_REF_NAME}"
          setup=$(find dist -name '*setup.exe' | head -1)
          portable=$(find dist -name '*.zip' | head -1)
          test -n "$setup" || { echo "installer not found"; exit 1; }
          test -n "$portable" || { echo "portable kit not found"; exit 1; }
          cp "$setup" "release/GP-Relay-Setup-${version}.exe"
          cp "$portable" "release/GP-Relay-Portable-${version}.zip"
          ls -la release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "GP Relay ${GITHUB_REF_NAME}" \
            --generate-notes
